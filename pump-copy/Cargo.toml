[package]
name = "pump-copy"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Causal Pump.fun/PumpSwap wallet research, flow signals and paper copy trading"

[dependencies]
anyhow = "=1.0.98"
base64 = "=0.22.1"
bs58 = "=0.5.1"
clap = { version = "=4.5.36", features = ["derive"] }
flate2 = "=1.1.2"
futures-util = "0.3"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
solana-pubkey = { version = "=2.4.0", features = ["curve25519"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "signal"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "=0.8.23"

[dev-dependencies]
tempfile = "=3.19.1"

[profile.release]
lto = "thin"
codegen-units = 1
